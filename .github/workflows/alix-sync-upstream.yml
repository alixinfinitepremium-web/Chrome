name: Sync Chromium upstream

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/alix-sync-upstream.yml"

permissions:
  contents: write

concurrency:
  group: sync-chromium-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync fork main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge upstream main server-side
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main --jq '{message, merge_type, base_branch}'

      - name: Verify no upstream lag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream="$(gh api "repos/chromium/chromium/commits/main" --jq '.sha')"
          behind="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${upstream}...main" --jq '.behind_by')"
          printf 'upstream=%s\nbehind_by=%s\n' "$upstream" "$behind"
          test "$behind" -eq 0
