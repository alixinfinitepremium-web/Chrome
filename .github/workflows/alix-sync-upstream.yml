name: Sync Chromium upstream

on:
  # Explicit off-hour slots reduce schedule drops during GitHub Actions load.
  schedule:
    - cron: "14,34,54 * * * *"
  # A workflow-file push is also the recovery trigger when GitHub drops cron runs.
  # Cron reactivation: 2026-07-15T06:30:00Z (stale schedule watchdog).
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/alix-sync-upstream.yml"

permissions:
  contents: write

concurrency:
  group: sync-chromium-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync fork main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Converge fork main to Chromium main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            # Freeze the target before merging. Chromium can advance several
            # times while this job runs, so requiring zero lag against a later
            # live head creates false failures even after a successful import.
            frozen_upstream="$(gh api "repos/chromium/chromium/commits/main" --jq '.sha')"

            gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
              -f branch=main --jq '{message, merge_type, base_branch}'

            mirror="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
            frozen_behind="$(gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${frozen_upstream}...main" \
              --jq '.behind_by')"
            live_upstream="$(gh api "repos/chromium/chromium/commits/main" --jq '.sha')"
            live_behind="$(gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${live_upstream}...main" \
              --jq '.behind_by')"
            printf 'attempt=%s frozen_upstream=%s mirror=%s frozen_behind=%s live_upstream=%s live_behind=%s\n' \
              "$attempt" "$frozen_upstream" "$mirror" "$frozen_behind" \
              "$live_upstream" "$live_behind"

            if test "$frozen_behind" -eq 0; then
              {
                printf '### Chromium mirror freshness\n\n'
                printf -- '- Frozen upstream imported: `%s`\n' "$frozen_upstream"
                printf -- '- Live upstream at verification: `%s`\n' "$live_upstream"
                printf -- '- Mirror: `%s`\n' "$mirror"
                printf -- '- Live lag: `%s`\n' "$live_behind"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          printf 'Mirror did not contain any frozen upstream target after four attempts.\n' >&2
          exit 1

