name: Sync Chromium upstream

on:
  # Explicit off-hour slots reduce schedule drops during GitHub Actions load.
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/alix-sync-upstream.yml"

permissions:
  contents: write

concurrency:
  group: sync-chromium-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync fork main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Converge fork main to Chromium main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
              -f branch=main --jq '{message, merge_type, base_branch}'

            upstream="$(gh api "repos/chromium/chromium/commits/main" --jq '.sha')"
            mirror="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
            behind="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${upstream}...main" --jq '.behind_by')"
            printf 'attempt=%s upstream=%s mirror=%s behind_by=%s\n' \
              "$attempt" "$upstream" "$mirror" "$behind"

            if test "$behind" -eq 0; then
              {
                printf '### Chromium mirror freshness\n\n'
                printf -- '- Upstream: `%s`\n' "$upstream"
                printf -- '- Mirror: `%s`\n' "$mirror"
                printf -- '- Behind: `%s`\n' "$behind"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          printf 'Mirror did not converge after four attempts.\n' >&2
          exit 1
